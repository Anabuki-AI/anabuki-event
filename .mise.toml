min_version = "2026.1.0"
redactions = ["POSTGRES_PASSWORD", "GOOGLE_CLIENT_SECRET", "SECRET_KEY_BASE"]

[tools]
ruby = "3.4.7"
node = "22.19.0"
pnpm = "10.15.0"

[env]
_.file = { path = ".env", required = false }

[tasks.setup]
description = "開発環境を初期化（ルート .env 作成・Rails/Nuxt依存関係のインストール）"
run = [
  { task = "env:init" },
  { task = "backend:install" },
  { task = "frontend:install" },
]

[tasks."env:init"]
description = "存在しないルート .env を .env.example から作成"
run = '''node -e "const fs=require('node:fs'); const t='.env'; if (!fs.existsSync(t)) { fs.copyFileSync('.env.example',t); console.log('created '+t); } else { console.log('kept '+t); }"'''

[tasks."docker:check"]
description = "ルート .env を用意し、Docker Desktop が起動していることを確認"
depends = ["env:init"]
run = '''node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync('docker',['info'],{stdio:'ignore',shell:process.platform==='win32'}); if (r.status!==0) { console.error('Docker Engine に接続できません。Docker Desktop を起動し、起動完了後にもう一度実行してください。'); process.exit(1); }"'''

[tasks.dev]
description = "Rails・PostgreSQL・Nuxtを開発起動（Ctrl+Cで全停止）"
depends = ["docker:check"]
run = "node scripts/dev.mjs"
interactive = true

[tasks.stop]
description = "Docker 上の Rails と PostgreSQL を停止"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml down"

[tasks.logs]
description = "Docker 上の Rails と PostgreSQL のログを表示"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml logs -f"
interactive = true

[tasks."db:up"]
description = "Rails専用 PostgreSQL をバックグラウンド起動"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml up -d --wait postgres"

[tasks."db:down"]
description = "Rails専用 PostgreSQL を停止（DBデータは保持）"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml down"

[tasks."db:reset"]
description = "Rails専用 PostgreSQL volume を削除して作り直す（Java DBには触れない）"
depends = ["docker:check"]
confirm = { message = "Rails専用ローカルDBの全データを削除します。Java/本番DBは対象外です。続行しますか？", default = "no" }
run = [
  "docker compose --env-file .env -f backend/docker-compose.yml down --volumes",
  "docker compose --env-file .env -f backend/docker-compose.yml up -d --wait postgres",
]

[tasks."backend:install"]
description = "Rails gemをインストール"
dir = "backend"
run = "bundle install"

[tasks."backend:dev"]
description = "Rails と Rails専用 PostgreSQL を前面起動"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml up --build"
interactive = true

[tasks."backend:run"]
description = "Rails専用 PostgreSQL をDocker、Rails APIをローカルRubyで起動"
depends = ["db:up", "backend:install"]
dir = "backend"
run = "bundle exec rails db:prepare && bundle exec rails server -p ${PORT:-8080}"
interactive = true

[tasks."backend:test"]
description = "Railsテストを実行（Rails専用 PostgreSQL が必要）"
depends = ["db:up", "backend:install"]
dir = "backend"
run = "DATABASE_URL= RAILS_ENV=test bundle exec rails db:create db:prepare && DATABASE_URL= RAILS_ENV=test bundle exec rails test"

[tasks."backend:build"]
description = "Rails の eager loading と routes を検証"
depends = ["backend:install"]
dir = "backend"
run = ["bundle exec rails zeitwerk:check", "bundle exec rails routes"]

[tasks."frontend:install"]
description = "pnpm lockfile に従って依存関係をインストール"
dir = "frontend"
run = "pnpm install --frozen-lockfile"

[tasks."frontend:dev"]
description = "Nuxt 開発サーバーを起動"
dir = "frontend"
run = "pnpm dev"
interactive = true

[tasks."frontend:lint"]
description = "フロントエンドを ESLint で検査"
dir = "frontend"
run = "pnpm lint"

[tasks."frontend:typecheck"]
description = "フロントエンドの型検査を実行"
dir = "frontend"
run = "pnpm typecheck"

[tasks."frontend:test"]
description = "フロントエンドのユニットテストを実行"
dir = "frontend"
run = "pnpm test"

[tasks."frontend:check"]
description = "フロントエンドの lint・型検査・テストを順番に実行"
run = [
  { task = "frontend:lint" },
  { task = "frontend:typecheck" },
  { task = "frontend:test" },
]

[tasks."frontend:build"]
description = "Nuxtの本番ビルドを作成"
dir = "frontend"
run = "pnpm build"

[tasks.test]
description = "Rails とフロントエンドのテストを実行"
run = [{ tasks = ["backend:test", "frontend:test"] }]

[tasks.check]
description = "コミット前の全検査（Rails test + frontend lint/typecheck/test）"
run = [{ tasks = ["backend:test", "frontend:check"] }]

[tasks.build]
description = "Rails検証とフロントエンドをビルド"
run = [{ tasks = ["backend:build", "frontend:build"] }]

[tasks.ci]
description = "CI相当の検査とビルドを順番に実行"
run = [
  { task = "check" },
  { task = "build" },
]
