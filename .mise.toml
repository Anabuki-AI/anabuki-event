min_version = "2026.1.0"
redactions = ["POSTGRES_PASSWORD"]

[tools]
java = "temurin-25"
maven = "3.9.11"
node = "22.19.0"
pnpm = "10.15.0"

[env]
_.file = { path = ".env", required = false }

# 公開URL設定（本番ではこのブロックの値だけをFQDNへ差し替える）
# OAuthの実装/APIはまだ存在しないため、現時点では接続先を予約する。
PUBLIC_BASE_URL = "http://localhost:3000"
ADMIN_FRONTEND_URL = "http://localhost:3000/admin"
GOOGLE_OAUTH_CALLBACK_URL = "http://localhost:8080/api/auth/google/callback"

[tasks.setup]
description = "開発環境を初期化（ルート .env 作成・フロントエンド依存関係のインストール）"
run = [
  { task = "env:init" },
  { task = "frontend:install" },
]

[tasks."env:init"]
description = "存在しないルート .env を .env.example から作成"
run = '''node -e "const fs=require('node:fs'); const t='.env'; if (!fs.existsSync(t)) { fs.copyFileSync('.env.example',t); console.log('created '+t); } else { console.log('kept '+t); }"'''

[tasks."docker:check"]
description = "ルート .env を用意し、Docker Desktop が起動していることを確認"
depends = ["env:init"]
run = '''node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync('docker',['info'],{stdio:'ignore',shell:process.platform==='win32'}); if (r.status!==0) { console.error('Docker Engine に接続できません。Docker Desktop を起動し、起動完了後にもう一度実行してください。'); process.exit(1); }"'''

[tasks.dev]
description = "ルート .env を読み込み、バックエンド・DB・Nuxtを開発起動（Ctrl+Cで全停止）"
depends = ["docker:check"]
run = "node scripts/dev.mjs"
interactive = true

[tasks.stop]
description = "Docker 上のバックエンドと PostgreSQL を停止"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml down"

[tasks.logs]
description = "Docker 上のバックエンドと PostgreSQL のログを表示"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml logs -f"
interactive = true

[tasks."db:up"]
description = "ルート .env を使って PostgreSQL だけをバックグラウンドで起動"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml up -d --wait postgres"

[tasks."db:down"]
description = "Docker Compose サービスを停止（DB データは保持）"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml down"

[tasks."db:reset"]
description = "PostgreSQL のボリュームを削除して作り直す"
depends = ["docker:check"]
confirm = { message = "ローカル PostgreSQL の全データを削除します。続行しますか？", default = "no" }
run = [
  "docker compose --env-file .env -f backend/docker-compose.yml down --volumes",
  "docker compose --env-file .env -f backend/docker-compose.yml up -d --wait postgres",
]

[tasks."backend:dev"]
description = "ルート .env を使ってバックエンドと PostgreSQL を前面起動"
depends = ["docker:check"]
run = "docker compose --env-file .env -f backend/docker-compose.yml up --build"
interactive = true

[tasks."backend:run"]
description = "ルート .env を使い、PostgreSQL を Docker、バックエンドをローカル Java で起動"
depends = ["db:up"]
dir = "backend"
run = [
  "mvn -B -DskipTests package",
  "mise exec -- java -jar target/backend.jar",
]
interactive = true

[tasks."backend:test"]
description = "バックエンドのテストを実行"
dir = "backend"
run = "mvn -B test"

[tasks."backend:build"]
description = "バックエンドの実行可能 JAR を作成"
dir = "backend"
run = "mvn -B -DskipTests package"

[tasks."frontend:install"]
description = "pnpm lockfile に従って依存関係をインストール"
dir = "frontend"
run = "pnpm install --frozen-lockfile"

[tasks."frontend:dev"]
description = "Nuxt 開発サーバーを起動"
dir = "frontend"
run = "pnpm dev"
interactive = true

[tasks."frontend:lint"]
description = "フロントエンドを ESLint で検査"
dir = "frontend"
run = "pnpm lint"

[tasks."frontend:typecheck"]
description = "フロントエンドの型検査を実行"
dir = "frontend"
run = "pnpm typecheck"

[tasks."frontend:test"]
description = "フロントエンドのユニットテストを実行"
dir = "frontend"
run = "pnpm test"

[tasks."frontend:check"]
description = "フロントエンドの lint・型検査・テストを順番に実行"
run = [
  { task = "frontend:lint" },
  { task = "frontend:typecheck" },
  { task = "frontend:test" },
]

[tasks."frontend:build"]
description = "フロントエンドの本番ビルドを作成"
dir = "frontend"
run = "pnpm build"

[tasks.test]
description = "バックエンドとフロントエンドのテストを実行"
run = [{ tasks = ["backend:test", "frontend:test"] }]

[tasks.check]
description = "コミット前の全検査（backend test + frontend lint/typecheck/test）"
run = [{ tasks = ["backend:test", "frontend:check"] }]

[tasks.build]
description = "バックエンドとフロントエンドをビルド"
run = [{ tasks = ["backend:build", "frontend:build"] }]

[tasks.ci]
description = "CI 相当の検査とビルドを順番に実行"
run = [
  { task = "check" },
  { task = "build" },
]
