min_version = "2026.1.0"

[tools]
java = "temurin-25"
maven = "3.9.11"
node = "22.19.0"
pnpm = "10.15.0"

[env]
_.file = { path = ".env", required = false, redact = true }

[tasks.setup]
description = "開発環境を初期化（ルート .env 作成・フロントエンド依存関係のインストール）"
run = [
  { task = "env:init" },
  { task = "frontend:install" },
]

[tasks."env:init"]
description = "存在しないルート .env を .env.example から作成"
run = '''node -e "const fs=require('node:fs'); const t='.env'; if (!fs.existsSync(t)) { fs.copyFileSync('.env.example',t); console.log('created '+t); } else { console.log('kept '+t); }"'''

[tasks.dev]
description = "バックエンドを Docker で起動し、Nuxt 開発サーバーを前面で起動"
depends = ["setup"]
run = [
  "docker compose -f backend/docker-compose.yml up -d --build --wait",
  "pnpm --dir frontend dev",
]

[tasks.stop]
description = "Docker 上のバックエンドと PostgreSQL を停止"
run = "docker compose -f backend/docker-compose.yml down"

[tasks.logs]
description = "Docker 上のバックエンドと PostgreSQL のログを表示"
run = "docker compose -f backend/docker-compose.yml logs -f"
interactive = true

[tasks."db:up"]
description = "PostgreSQL だけをバックグラウンドで起動"
dir = "backend"
run = "docker compose up -d --wait postgres"

[tasks."db:down"]
description = "Docker Compose サービスを停止（DB データは保持）"
dir = "backend"
run = "docker compose down"

[tasks."db:reset"]
description = "PostgreSQL のボリュームを削除して作り直す"
dir = "backend"
confirm = { message = "ローカル PostgreSQL の全データを削除します。続行しますか？", default = "no" }
run = [
  "docker compose down --volumes",
  "docker compose up -d --wait postgres",
]

[tasks."backend:dev"]
description = "バックエンドと PostgreSQL を Docker Compose で前面起動"
dir = "backend"
run = "docker compose up --build"
interactive = true

[tasks."backend:run"]
description = "PostgreSQL を Docker、バックエンドをローカル Java で起動"
depends = ["db:up"]
dir = "backend"
run = [
  "mvn -B -DskipTests package",
  "java -jar target/backend.jar",
]
interactive = true

[tasks."backend:test"]
description = "バックエンドのテストを実行"
dir = "backend"
run = "mvn -B test"

[tasks."backend:build"]
description = "バックエンドの実行可能 JAR を作成"
dir = "backend"
run = "mvn -B -DskipTests package"

[tasks."frontend:install"]
description = "pnpm lockfile に従って依存関係をインストール"
dir = "frontend"
run = "pnpm install --frozen-lockfile"

[tasks."frontend:dev"]
description = "Nuxt 開発サーバーを起動"
dir = "frontend"
run = "pnpm dev"
interactive = true

[tasks."frontend:lint"]
description = "フロントエンドを ESLint で検査"
dir = "frontend"
run = "pnpm lint"

[tasks."frontend:typecheck"]
description = "フロントエンドの型検査を実行"
dir = "frontend"
run = "pnpm typecheck"

[tasks."frontend:test"]
description = "フロントエンドのユニットテストを実行"
dir = "frontend"
run = "pnpm test"

[tasks."frontend:check"]
description = "フロントエンドの lint・型検査・テストを順番に実行"
run = [
  { task = "frontend:lint" },
  { task = "frontend:typecheck" },
  { task = "frontend:test" },
]

[tasks."frontend:build"]
description = "フロントエンドの本番ビルドを作成"
dir = "frontend"
run = "pnpm build"

[tasks.test]
description = "バックエンドとフロントエンドのテストを実行"
run = [{ tasks = ["backend:test", "frontend:test"] }]

[tasks.check]
description = "コミット前の全検査（backend test + frontend lint/typecheck/test）"
run = [{ tasks = ["backend:test", "frontend:check"] }]

[tasks.build]
description = "バックエンドとフロントエンドをビルド"
run = [{ tasks = ["backend:build", "frontend:build"] }]

[tasks.ci]
description = "CI 相当の検査とビルドを順番に実行"
run = [
  { task = "check" },
  { task = "build" },
]
